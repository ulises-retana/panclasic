<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compras — Administración Pan Clásico</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <aside class="admin-lateral" id="admin-menu"></aside>

  <main class="admin-main">
    <div class="admin-cabecera">
      <h1>Compras</h1>
    </div>

    <div class="tabla-caja">
      <table class="tabla">
        <thead>
          <tr>
            <th>#</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Pago</th>
            <th class="derecha">Total</th>
            <th class="derecha">Detalle</th>
          </tr>
        </thead>
        <tbody id="tabla-compras"></tbody>
      </table>
    </div>
  </main>

  <dialog id="modal-compra">
    <div class="modal-cuerpo">
      <h2 id="compra-titulo">Compra</h2>
      <div id="compra-detalle"></div>
      <div class="modal-acciones">
        <button type="button" class="btn btn-secundario" data-cerrar>Cerrar</button>
      </div>
    </div>
  </dialog>

  <script src="../js/utils.js"></script>
  <script src="../js/admin/comun.js"></script>
  <script src="../js/admin/compras.js"></script>
</body>
</html>
