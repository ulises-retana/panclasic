<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta en Pan Clásico.">
    <title>Crear Cuenta | Pan Clásico</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-body">

    <header>
        <nav class="navbar" style="justify-content: center;">
            <div class="logo">
                🥖 Pan Clásico
            </div>
        </nav>
    </header>

    <main class="login-main">
        <div class="login-card">

            <span class="login-badge">Crear Cuenta</span>
            <h1>Únete a Pan Clásico</h1>
            <p class="subtexto">Regístrate con tu correo electrónico.</p>

            <div id="login-alerta" class="login-alerta" role="alert"></div>

            <form id="form-registro" class="login-form">

                <div class="login-campo">
                    <label for="nombre">Nombre completo</label>
                    <div class="login-input-wrap">
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" autocomplete="name"
                            maxlength="100" required autofocus>
                    </div>
                </div>

                <div class="login-campo">
                    <label for="email">Correo electrónico</label>
                    <div class="login-input-wrap">
                        <input type="email" id="email" name="email" placeholder="correo@ejemplo.com"
                            autocomplete="email" maxlength="150" required>
                    </div>
                </div>

                <div class="login-campo">
                    <label for="password">Contraseña</label>
                    <div class="login-input-wrap">
                        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres"
                            autocomplete="new-password" minlength="8" required>
                        <button type="button" id="btn-toggle-pass" class="btn-toggle-pass"
                            aria-label="Mostrar u ocultar contraseña">👁️</button>
                    </div>
                </div>

                <div class="login-campo">
                    <label for="password2">Confirmar contraseña</label>
                    <div class="login-input-wrap">
                        <input type="password" id="password2" name="password2" placeholder="Repite tu contraseña"
                            autocomplete="new-password" minlength="8" required>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="boton btn-login">
                    Crear Cuenta
                </button>

            </form>

            <p style="text-align: center; margin-top: 1.2rem; font-size: 0.95rem;">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </p>

            <a href="index.html" class="enlace-volver">
                ← Volver a la panadería
            </a>

        </div>
    </main>

    <footer>
        <p>© 2026 Pan Clásico - Todos los derechos reservados</p>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
