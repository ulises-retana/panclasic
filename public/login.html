<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en Pan Clásico.">
    <title>Iniciar Sesión | Pan Clásico</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-body">

    <header>
        <nav class="navbar" style="justify-content: center;">
            <div class="logo"><img src="img/logo-cursiva.png" alt="Pan Clásico" height="40"></div>
        </nav>
    </header>

    <main class="login-main">
        <div class="login-card">

            <span class="login-badge">Iniciar Sesión</span>
            <h1>Bienvenido de nuevo</h1>
            <p class="subtexto">Accede con tu correo electrónico.</p>

            <div id="login-alerta" class="login-alerta" role="alert"></div>

            <form id="form-login" class="login-form">

                <div class="login-campo">
                    <label for="email">Correo electrónico</label>
                    <div class="login-input-wrap">
                        <input type="email" id="email" name="email" placeholder="correo@ejemplo.com"
                            autocomplete="email" required autofocus>
                    </div>
                </div>

                <div class="login-campo">
                    <label for="password">Contraseña</label>
                    <div class="login-input-wrap">
                        <input type="password" id="password" name="password" placeholder="••••••••"
                            autocomplete="current-password" required>
                        <button type="button" id="btn-toggle-pass" class="btn-toggle-pass"
                            aria-label="Mostrar u ocultar contraseña">👁️</button>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="boton btn-login">
                    Iniciar Sesión
                </button>

            </form>

            <p style="text-align: center; margin-top: 1.2rem; font-size: 0.95rem;">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>

            <a href="index.html" class="enlace-volver">
                ← Volver a la panadería
            </a>

        </div>
    </main>

    <footer>
        <p>© 2026 Pan Clásico - Todos los derechos reservados</p>
    </footer>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
