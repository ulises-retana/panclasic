<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — Pan Clásico</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="img/pan-recortado.png">
</head>
<body class="login-body">
  <main class="login-main">
    <section class="login-card">
      <div class="login-logo"><img src="img/logo-cursiva.png" alt="Pan Clásico" height="40"></div>
      <span class="login-badge">Recuperar acceso</span>
      <h1>Recuperar contraseña</h1>

      <form id="form-solicitar" class="login-form">
        <p class="subtexto">Escribe tu correo y te enviaremos un código de 6 dígitos.</p>
        <div class="login-campo">
          <label for="email-solicitar">Correo</label>
          <input type="email" id="email-solicitar" name="email" maxlength="150" required autocomplete="email">
        </div>
        <button type="submit" class="boton btn-login">Enviar código</button>
      </form>

      <form id="form-cambiar" class="login-form" hidden>
        <p class="subtexto">Revisa tu correo e ingresa el código con tu nueva contraseña.</p>
        <div class="login-campo">
          <label for="codigo">Código</label>
          <input type="text" id="codigo" name="codigo" class="input-codigo" placeholder="000000" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="one-time-code">
        </div>
        <div class="login-campo">
          <label for="password-nueva">Nueva contraseña</label>
          <input type="password" id="password-nueva" name="password" minlength="8" maxlength="72" required autocomplete="new-password">
        </div>
        <div class="login-campo">
          <label for="confirmar-nueva">Confirmar contraseña</label>
          <input type="password" id="confirmar-nueva" name="confirmar" minlength="8" maxlength="72" required autocomplete="new-password">
        </div>
        <button type="submit" class="boton btn-login">Cambiar contraseña</button>
      </form>

      <a href="login.html" class="enlace-volver">← Volver a iniciar sesión</a>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/recuperar.js"></script>
</body>
</html>
